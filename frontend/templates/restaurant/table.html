<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý bàn</title>

    <link rel="stylesheet" href="../../static/css/restaurant.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">

        <h2>🍽️ Restaurant</h2>

        <ul>

            <li>
                <a href="#">
                    Dashboard
                </a>
            </li>

            <li class="active">
                <a href="#">
                    Quản lý bàn
                </a>
            </li>

            <li>
                <a href="confirmbooking.html">
                    Xác nhận đặt bàn
                </a>
            </li>

        </ul>

    </div>

    <!-- Main -->
    <div class="main" id="table-management-panel">

        <div class="topbar">

            <h2>Quản lý bàn</h2>

            <button onclick="addTable()">
                + Thêm bàn
            </button>

        </div>

        <!-- message -->
        <div id="restaurant-page-message"></div>

        <!-- tables -->
        <div
            class="tables-container"
            id="tables-container">
        </div>

    </div>

</div>

<!-- Modal -->
<div id="booking-modal" class="modal">

    <div class="modal-content">

        <span class="close" id="modal-close">
            &times;
        </span>

        <h3>Đặt bàn</h3>

        <form id="booking-form">

            <input
                type="hidden"
                id="booking-table-id"
            >

            <label>Tên khách:</label>

            <input
                type="text"
                id="customer-name"
                required
            >

            <label>Số người:</label>

            <input
                type="number"
                id="customer-count"
                min="1"
                required
            >

            <button type="submit">
                Đặt
            </button>

        </form>

    </div>

</div>

<script>

const TABLE_API =
"http://127.0.0.1:5000/api/v1/restaurant/tables";

const messageBox =
document.getElementById(
    "restaurant-page-message"
);

// auth headers
function getAuthHeaders(includeJson = true){

    const token =
    localStorage.getItem("token");

    const headers = {};

    if(token){
        headers["Authorization"] =
        `Bearer ${token}`;
    }

    if(includeJson){
        headers["Content-Type"] =
        "application/json";
    }

    return headers;
}

// message
function showPageMessage(
    message,
    type = "info"
){

    if(!messageBox) return;

    messageBox.innerHTML = message;

    messageBox.style.display = "block";

    if(type === "error"){
        messageBox.style.background = "#ffebee";
        messageBox.style.color = "#c62828";
    }

    else if(type === "success"){
        messageBox.style.background = "#e8f5e9";
        messageBox.style.color = "#2e7d32";
    }

    else{
        messageBox.style.background = "#eceff1";
        messageBox.style.color = "#333";
    }
}

// render card
function renderTableCard(table){

    let capacity = 4;

    let status =
    table.status || table.Status || "Available";

    let id =
    table.id || table.TableID;

    let customer =
    table.customer_name || "";

    let extraClass = "";

    if(id % 9 === 0){
        capacity = 8;
        extraClass = "double";
    }

    // available
    if(
        status === "available" ||
        status === "Available" ||
        status === "Trống"
    ){

        return `
        <div class="card available ${extraClass}">

            <div class="icon">
                🍽️
            </div>

            <h3>
                Bàn ${id}
            </h3>

            <p>Trống</p>

            <p>
                ${capacity} người
            </p>

        </div>
        `;
    }

    // reserved
    return `
    <div
        class="card reserved ${extraClass}"
        onclick="openOrder(${id})"
    >

        <div class="icon">
            🍽️
        </div>

        <h3>
            Bàn ${id}
        </h3>

        <p>
            👤 ${customer}
        </p>

        <p>
            ${capacity} người
        </p>

        <div class="actions">

            <button
                onclick="
                cancelBooking(
                    event,
                    ${id}
                )"
            >
                Hủy
            </button>

        </div>

    </div>
    `;
}

// render tables
function renderTablesFromAPI(tables){

    const container =
    document.getElementById(
        "tables-container"
    );

    container.innerHTML =
    tables.map(
        renderTableCard
    ).join("");
}

// load tables
async function loadTables(){

    try{

        const response =
        await fetch(TABLE_API,{
            method:"GET",
            headers:getAuthHeaders(true)
        });

        if(!response.ok){
            throw new Error("API lỗi");
        }

        const tables =
        await response.json();

        renderTablesFromAPI(tables);

    }

    catch(error){

        console.log(error);

        showPageMessage(
            "Không tải được danh sách bàn",
            "error"
        );
    }
}

// update table status
async function updateTableStatus(
    tableId,
    payload
){

    const response =
    await fetch(
        `${TABLE_API}/${tableId}/status`,
        {
            method:"PUT",
            headers:getAuthHeaders(true),
            body:JSON.stringify(payload)
        }
    );

    if(!response.ok){
        throw new Error(
            "Không cập nhật được trạng thái bàn"
        );
    }

    return response.json();
}

// cancel booking
async function cancelBooking(event,id){

    event.stopPropagation();

    if(
        !confirm("Hủy đặt bàn này?")
    ) return;

    try{

        await updateTableStatus(id,{
            Status:"Available",
            customer_name:"",
            customer_count:0
        });

        await loadTables();

        showPageMessage(
            "Đã hủy đặt bàn",
            "success"
        );

    }

    catch(error){

        showPageMessage(
            error.message,
            "error"
        );
    }
}

// add table
async function addTable(){

    const capacity =
    parseInt(
        prompt("Nhập số chỗ ngồi:"),
        10
    );

    if(!capacity || capacity <= 0){

        showPageMessage(
            "Số chỗ không hợp lệ",
            "error"
        );

        return;
    }

    try{

        const listResponse =
        await fetch(TABLE_API,{
            method:"GET",
            headers:getAuthHeaders(true)
        });

        const tables =
        await listResponse.json();

        const newNumber =
        tables.length + 1;

        const createResponse =
        await fetch(TABLE_API,{
            method:"POST",
            headers:getAuthHeaders(true),

            body:JSON.stringify({

                TableNumber:
                `B${newNumber}`,

                Capacity:capacity,

                Status:"Available"

            })
        });

        if(createResponse.ok){

            showPageMessage(
                "Đã thêm bàn mới",
                "success"
            );

            await loadTables();
        }

        else{

            const errorData =
            await createResponse.json();

            throw new Error(
                errorData.error
            );
        }

    }

    catch(error){

        console.log(error);

        showPageMessage(
            "Không thêm được bàn",
            "error"
        );
    }
}

// open order
function openOrder(id){

    window.location.href =
    `./orders.html?table_id=${id}`;
}

// global
window.cancelBooking =
cancelBooking;

window.addTable =
addTable;

window.openOrder =
openOrder;

// load
window.onload = async () => {

    await loadTables();

};

</script>

</body>
</html>
