<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Nhà Hàng</title>
    <link rel="stylesheet" href="/frontend/static/css/style.css">
</head>
<body>

<h1>Menu Nhà Hàng</h1>

<!-- ===== THÊM MÓN ===== -->
<h3>Thêm món</h3>
<input id="name" placeholder="Tên món">
<input id="price" type="number" placeholder="Giá">
<input id="image" placeholder="Link ảnh">
<input id="category" placeholder="Loại (lau, nuong...)">
<button onclick="addFood()">Thêm món</button>

<hr>

<div class="menu-container" id="menuContainer"></div>

<script>

let MENU_DATA = [];
const menuContainer = document.getElementById('menuContainer');


// ===== LOAD MENU =====
async function loadMenu() {

        try {
            const res = await fetch("http://127.0.0.1:5000/api/v1/restaurant/menu/admin", {

        const data = await res.json();

        MENU_DATA = data.map(item => ({
            id: item.id,
            name: item.name,
            price: item.price,
            image: item.image,
            category: item.category,
            visible: item.visible
        }));

        renderMenu(MENU_DATA);

    } catch (err) {
        console.error("Load menu error:", err);
    }
}


// ===== RENDER MENU =====
function renderMenu(dataToRender) {
    menuContainer.innerHTML = '';

    dataToRender.forEach(item => {
        const div = document.createElement('div');
        div.className = 'menu-item';

        div.style.opacity = item.visible ? "1" : "0.4";

        div.innerHTML = `
            <img src="${item.image || 'https://via.placeholder.com/150'}">
            <h3>${item.name}</h3>
            <p>${Number(item.price).toLocaleString()}₫</p>

            <button onclick="editFood(${item.id})">Sửa</button>
            <button onclick="deleteFood(${item.id})">Xoá</button>

            <button onclick="toggleFood(${item.id})">
                ${item.visible ? "Ẩn món" : "Hiện món"}
            </button>
        `;

        menuContainer.appendChild(div);
    });
}


// ===== THÊM MÓN =====
async function addFood() {
    const name = document.getElementById('name').value;
    const price = Number(document.getElementById('price').value);
    const image = document.getElementById('image').value;
    const category = document.getElementById('category').value;

    if (!name || !price) {
        alert("Nhập thiếu!");
        return;
    }

    try {
        const res = await fetch("http://127.0.0.1:5000/api/v1/restaurant/menu", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ name, price, image, category })
        });

        if (!res.ok) return alert("Thêm thất bại");

        alert("Thêm thành công");
        loadMenu();

    } catch (err) {
        console.error(err);
    }
}


// ===== XOÁ =====
async function deleteFood(id) {
    if (!confirm("Xoá món này?")) return;

    try {
        const res = await fetch(
            `http://127.0.0.1:5000/api/v1/restaurant/menu/${id}`,
            { method: "DELETE" }
        );

        if (!res.ok) return alert("Xoá thất bại");

        loadMenu();

    } catch (err) {
        console.error(err);
    }
}


// ===== SỬA =====
async function editFood(id) {
    const name = prompt("Tên mới:");
    const price = Number(prompt("Giá mới:"));

    if (!name || !price) return;

    try {
        const res = await fetch(
            `http://127.0.0.1:5000/api/v1/restaurant/menu/${id}`,
            {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ name, price })
            }
        );

        if (!res.ok) return alert("Sửa thất bại");

        alert("Sửa thành công");
        loadMenu();

    } catch (err) {
        console.error(err);
    }
}


// ===== ẨN / HIỆN =====
async function toggleFood(id) {
    try {
        const res = await fetch(
            `http://127.0.0.1:5000/api/v1/restaurant/menu/${id}/toggle`,
            { method: "PUT" }
        );

        if (!res.ok) return alert("Lỗi toggle");

        loadMenu();

    } catch (err) {
        console.error(err);
    }
}


// ===== INIT =====
loadMenu();

</script>

</body>
</html>
